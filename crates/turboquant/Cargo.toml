[package]
name = "turboquant"
version = "0.1.0"
edition = "2021"
description = "TurboQuant vector compression: QJL (1-bit) + PolarQuant (4-bit angles + 8-bit radii) with two-stage search"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
memmap2 = "0.9"
bytemuck = { version = "1.14", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
