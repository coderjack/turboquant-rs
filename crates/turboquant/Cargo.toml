[package]
name = "turboquant"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "TurboQuant vector compression: rotation + Lloyd-Max + QJL residual correction"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
ort = "2.0.0-rc.12"
tokenizers = "0.20"

[[example]]
name = "basic_index"

[[example]]
name = "semantic_search"

[[example]]
name = "components"
