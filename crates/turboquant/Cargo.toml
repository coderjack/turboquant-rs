[package]
name = "turboquant"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "TurboQuant vector compression: QJL (1-bit) + TurboQuant_mse (2-4 bit optimal scalar quantization) with two-stage search"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
memmap2 = "0.9"
bytemuck = { version = "1.14", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
