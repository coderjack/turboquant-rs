[package]
name = "codesearch-mcp"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Semantic code search MCP server using TurboQuant-compressed bge-code-v1 embeddings"

[dependencies]
turboquant = { path = "../turboquant" }
rmcp = { version = "1.3", features = ["server", "transport-io"] }
ort = "2.0.0-rc.12"
ndarray = "0.16"
tokenizers = "0.20"
rusqlite = { version = "0.33", features = ["bundled"] }
ignore = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
