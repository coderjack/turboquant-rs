[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Unified agent memory: session context ranking + persistent cross-session semantic recall, powered by TurboQuant compression"

[dependencies]
turboquant = { path = "../turboquant" }
ort = "2.0.0-rc.12"
ndarray = "0.16"
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glob = "0.3"
thiserror = "2"
tempfile = "3"
